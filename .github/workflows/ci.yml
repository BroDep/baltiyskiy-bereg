name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install uv
          uv sync

      - name: Run ruff linter
        run: uv run ruff check . || true

      - name: Check Python syntax
        run: |
          if [ -d "src" ]; then
            python -m py_compile src/*.py 2>/dev/null || echo "Syntax OK"
          else
            echo "No src directory yet"
          fi
