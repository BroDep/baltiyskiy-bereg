name: CD

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - '.github/workflows/ci.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ vars.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << 'EOF'
            cd baltiyskiy-bereg
            git pull origin dev
            docker compose down
            docker compose up -d
            docker ps
          EOF

      - name: Health check
        run: |
          sleep 15
          ssh -o StrictHostKeyChecking=no ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }} \
            "docker exec mssql-baltbereg /opt/mssql-tools/bin/sqlcmd \
             -S localhost -U SA -P '${{ secrets.MSSQL_PASSWORD }}' \
             -Q 'SELECT COUNT(*) FROM service_desk_tdbb.dbo.Task' -h -1"

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify success
        if: success()
        run: |
          echo "Deployment successful! 🚀"
          echo "Server: ${{ vars.SERVER_HOST }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "Deployment failed! ❌"
          echo "Check logs at: https://github.com/${{ github.repository }}/actions"
