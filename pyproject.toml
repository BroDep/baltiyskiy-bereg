[project]
name = "baltiyskiy-bereg-starter"
version = "0.1.0"
description = "Baltiyskiy Bereg service-desk chatbot starter — AI Business SPB Hackathon 2026"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.17",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic-settings>=2.8",
    "pymssql>=2.3",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "uvicorn>=0.34",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
