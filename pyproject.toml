[project]
name = "baltiyskiy-bereg-starter"
version = "0.1.0"
description = "Baltiyskiy Bereg service-desk chatbot starter — AI Business SPB Hackathon 2026"
requires-python = ">=3.11"
dependencies = [
    "pymssql>=2.3",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "fastapi>=0.136.0",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
