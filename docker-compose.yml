services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-CU18-ubuntu-20.04
    container_name: mssql-baltbereg
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P $${MSSQL_SA_PASSWORD} -Q 'SELECT 1' -b -o /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: baltiyskiy-bereg-app
    restart: unless-stopped
    environment:
      MSSQL_HOST: mssql
      MSSQL_PORT: 1433
      MSSQL_DATABASE: service_desk_tdbb
      MSSQL_USER: SA
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      YANDEX_GPT_API_KEY: "${YANDEX_GPT_API_KEY}"
      YANDEX_GPT_FOLDER_ID: "${YANDEX_GPT_FOLDER_ID}"
    ports:
      - "8000:8000"
    depends_on:
      mssql:
        condition: service_healthy

volumes:
  mssql-data:
